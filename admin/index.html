<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Portfolio admin</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital@0;1&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root{--red:#D6271C;--cream:#F2EBDD;--ink:#141414;--paper:#fff;--line:rgba(20,20,20,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.45 'EB Garamond',Georgia,serif}
.mono,label,.tab,button,.tag{font-family:'IBM Plex Mono',monospace}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--cream);display:flex;gap:16px;align-items:center;padding:12px 24px}
header h1{font:400 22px 'Anton',sans-serif;letter-spacing:.04em;margin:0;text-transform:uppercase;flex:1}
header .st{font:12px 'IBM Plex Mono',monospace;opacity:.8}
.btn{border:0;background:var(--red);color:#fff;padding:10px 18px;font:13px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:3px}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.sm{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
main{max-width:980px;margin:0 auto;padding:28px 24px 120px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;border-bottom:2px solid var(--ink)}
.tab{background:none;border:0;padding:10px 16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--ink);color:var(--cream)}
h2{font:400 40px/1 'Anton',sans-serif;text-transform:uppercase;margin:0 0 6px}
p.hint{margin:0 0 22px;color:#555}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.row>div{flex:1;min-width:200px}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
input[type=text],input[type=url],input[type=email],textarea,select{width:100%;padding:9px 10px;border:1.5px solid var(--ink);background:#fff;font:17px 'EB Garamond',Georgia,serif;border-radius:3px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--cream);padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.login{max-width:560px;margin:60px auto}
.login ol{padding-left:20px}
code{font-family:'IBM Plex Mono',monospace;font-size:14px;background:#fff;padding:1px 5px;border:1px solid var(--line)}
.thumb{max-width:160px;max-height:110px;border:1px solid var(--line);display:block;margin:6px 0;background:#fff}
.imgs{display:flex;gap:12px;flex-wrap:wrap}
.imgs>div{width:200px}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:4px;font:13px 'IBM Plex Mono',monospace;max-width:90vw;z-index:10}
.msg.err{background:var(--red)}
.dirty{color:#ffcf6b}
</style></head><body>
<div id="app"></div>
<script>
(function(){
'use strict';
var OWNER='bernardoreyesgh-dot', REPO='portfolio', BRANCH='main';
var ORIGIN='https://bernardoreyesgh-dot.github.io/portfolio/';
var API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/';
var TKEY='portfolioAdminToken';
var token=null, content=null, sha=null, dirty=false, tab='menu', pending={}, deleted=[], origSlugs=[];
var app=document.getElementById('app');

/* ---------- helpers ---------- */
function h(tag,attrs,kids){ var e=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){ var v=attrs[k]; if(k==='class') e.className=v; else if(k==='text') e.textContent=v; else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v); });
  (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); }); return e; }
function toast(t,err){ var m=h('div',{class:'msg'+(err?' err':''),text:t}); document.body.appendChild(m); setTimeout(function(){ m.remove(); },err?7000:3500); }
function b64(str){ var b=new TextEncoder().encode(str),s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(s){ var bin=atob(s.replace(/\s/g,'')),a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new TextDecoder().decode(a); }
function slugify(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||'project'; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function gh(path,opts){ opts=opts||{}; opts.headers=Object.assign({'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'},opts.headers||{});
  return fetch(API+path,opts); }
async function ghGet(path){ var r=await gh(path+'?ref='+BRANCH+'&t='+Date.now(),{cache:'no-store'}); if(r.status===404) return null; if(!r.ok) throw new Error('GitHub said '+r.status+' reading '+path); return r.json(); }
async function ghPut(path,b64content,message,existingSha){ var body={message:message,content:b64content,branch:BRANCH}; if(existingSha) body.sha=existingSha;
  var r=await gh(path,{method:'PUT',body:JSON.stringify(body)}); if(!r.ok){ var t=await r.text(); throw new Error('GitHub said '+r.status+' saving '+path+': '+t.slice(0,160)); } return r.json(); }
async function ghDel(path,message,existingSha){ var r=await gh(path,{method:'DELETE',body:JSON.stringify({message:message,sha:existingSha,branch:BRANCH})}); if(!r.ok) throw new Error('GitHub said '+r.status+' deleting '+path); }
function setDirty(v){ dirty=v===undefined?true:v; var s=document.getElementById('st'); if(s){ s.textContent=dirty?'Unpublished changes':'All changes published'; s.className='st'+(dirty?' dirty':''); } var b=document.getElementById('pub'); if(b) b.disabled=!dirty; }
window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

/* generic field */
function field(label,obj,key,opts){ opts=opts||{}; var el=opts.area?h('textarea',{rows:opts.rows||4}):h('input',{type:opts.type||'text'}); el.value=obj[key]==null?'':obj[key];
  el.addEventListener('input',function(){ obj[key]=el.value; setDirty(); if(opts.onInput) opts.onInput(el.value); }); return h('div',{},[h('label',{text:label}),el]); }
function listField(label,obj,key,hintText){ var el=h('textarea',{rows:Math.max(3,(obj[key]||[]).length*(key==='bullets'?3:1)+1)}); el.value=(obj[key]||[]).join('\n');
  el.addEventListener('input',function(){ obj[key]=el.value.split('\n').map(function(x){return x.trim();}).filter(Boolean); setDirty(); }); return h('div',{},[h('label',{text:label+(hintText?' ('+hintText+')':'')}),el]); }
function move(arr,i,d){ var j=i+d; if(j<0||j>=arr.length) return; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; setDirty(); render(); }
function ctl(arr,i,extra){ return h('div',{class:'bar'},[h('button',{class:'btn ghost sm',text:'↑',onclick:function(){ move(arr,i,-1); }}),h('button',{class:'btn ghost sm',text:'↓',onclick:function(){ move(arr,i,1); }}),h('button',{class:'btn ghost sm',text:'Delete',onclick:function(){ if(confirm('Delete this?')){ arr.splice(i,1); if(extra) extra(); setDirty(); render(); } }})]); }

/* ---------- images ---------- */
function loadImage(file){ return new Promise(function(res,rej){ var u=URL.createObjectURL(file),im=new Image(); im.onload=function(){ res(im); }; im.onerror=function(){ rej(new Error('Could not read that image')); }; im.src=u; }); }
function canvasJpeg(c,q){ return c.toDataURL('image/jpeg',q||0.86).split(',')[1]; }
async function stageImage(file){ var im=await loadImage(file); var max=1800, sc=Math.min(1,max/Math.max(im.width,im.height)); var w=Math.round(im.width*sc),hh=Math.round(im.height*sc);
  var c=document.createElement('canvas'); c.width=w; c.height=hh; var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,hh); x.drawImage(im,0,0,w,hh);
  var name='img/up-'+Date.now().toString(36)+'-'+slugify(file.name.replace(/\.[^.]+$/,'')).slice(0,24)+'.jpg';
  pending[name]={b64:canvasJpeg(c),preview:c.toDataURL('image/jpeg',0.6),im:im}; return name; }
function ogCard(im){ var c=document.createElement('canvas'); c.width=1200; c.height=630; var x=c.getContext('2d'); x.fillStyle='#F2EBDD'; x.fillRect(0,0,1200,630);
  var s=Math.min(1080/im.width,510/im.height); var w=im.width*s,hh=im.height*s; x.drawImage(im,(1200-w)/2,(630-hh)/2,w,hh); return canvasJpeg(c,0.88); }
function previewSrc(p){ if(pending[p]) return pending[p].preview; return /^https?:/.test(p)?p:ORIGIN+p.replace(/^\//,''); }
function imagePicker(label,get,set){ var cur=get(); var inp=h('input',{type:'file',accept:'image/*'});
  inp.addEventListener('change',async function(){ if(!inp.files[0]) return; try{ var p=await stageImage(inp.files[0]); set(p); setDirty(); render(); }catch(e){ toast(e.message,true); } });
  return h('div',{},[h('label',{text:label}),cur?h('img',{class:'thumb',src:previewSrc(cur)}):h('div',{class:'tag',text:'No image yet'}),inp]); }

/* ---------- tabs ---------- */
var ANCHORS=['#top','#work','#about','#cv','#contact'];
function tabMenu(){ var box=h('div',{});
  box.appendChild(h('h2',{text:'Menu'})); box.appendChild(h('p',{class:'hint',text:'The links in the top bar. Use #work, #about, #cv, #contact or a project (#p-your-project), or a full web address.'}));
  var all=ANCHORS.concat((content.projects||[]).map(function(p){return '#p-'+p.id;}));
  content.nav.forEach(function(n,i){ var row=h('div',{class:'card'},[h('div',{class:'row'},[field('Label',n,'label'),field('Link',n,'href',{})]),ctl(content.nav,i)]); box.appendChild(row); });
  box.appendChild(h('div',{class:'bar'},[h('button',{class:'btn',text:'+ Add menu item',onclick:function(){ content.nav.push({label:'New',href:'#work'}); setDirty(); render(); }}),h('span',{class:'tag',text:'Valid anchors: '+all.join(' ')})]));
  return box; }
function tabAbout(){ var a=content.about, box=h('div',{});
  box.appendChild(h('h2',{text:'About me'})); box.appendChild(h('p',{class:'hint',text:'Wrap words in **double stars** to make them bold.'}));
  box.appendChild(h('div',{class:'card'},[h('div',{class:'row'},[field('Small label',a,'eyebrow'),field('Headline',a,'title')]),h('div',{class:'row'},[field('Opening statement',a,'lead',{area:true,rows:4})]),h('div',{class:'row'},[field('Second paragraph',a,'text',{area:true,rows:3})])]));
  box.appendChild(h('h2',{text:'Capabilities'}));
  a.capabilities.forEach(function(c,i){ box.appendChild(h('div',{class:'card'},[h('div',{class:'row'},[field('Group name',c,'title')]),h('div',{class:'row'},[listField('Items',c,'items','one per line')]),ctl(a.capabilities,i)])); });
  box.appendChild(h('button',{class:'btn',text:'+ Add group',onclick:function(){ a.capabilities.push({title:'New group',items:[]}); setDirty(); render(); }}));
  return box; }
function tabCV(){ var c=content.cv, box=h('div',{});
  box.appendChild(h('h2',{text:'CV'})); box.appendChild(h('p',{class:'hint',text:'Entries marked NDA show the password note and unlock with the project password. Bullets: one per line, **bold** allowed.'}));
  box.appendChild(h('div',{class:'card'},[h('div',{class:'row'},[field('Location',c,'location'),field('Email',c,'email'),field('LinkedIn address',c,'linkedin')])]));
  c.sections.forEach(function(s,si){
    var sec=h('div',{class:'card'},[h('div',{class:'row'},[field('Section title',s,'title')])]);
    s.items.forEach(function(it,ii){
      var nda=h('select',{}); [['','Not under NDA'],['delta','NDA: Delta'],['bd','NDA: BD'],['deloitte','NDA: Deloitte'],['autosol','NDA: AutoSol']].forEach(function(o){ var op=h('option',{value:o[0],text:o[1]}); if((it.nda||'')===o[0]) op.selected=true; nda.appendChild(op); });
      nda.addEventListener('change',function(){ if(nda.value) it.nda=nda.value; else delete it.nda; setDirty(); });
      sec.appendChild(h('div',{class:'card',style:'background:#fbf8f2'},[h('div',{class:'row'},[field('Date',it,'when'),field('Title',it,'title'),field('Organisation',it,'org'),field('Note (optional)',it,'note')]),h('div',{class:'row'},[listField('Bullets',it,'bullets','one per line'),h('div',{style:'max-width:220px'},[h('label',{text:'Confidentiality'}),nda])]),ctl(s.items,ii)]));
    });
    sec.appendChild(h('div',{class:'bar'},[h('button',{class:'btn ghost sm',text:'+ Add entry',onclick:function(){ s.items.push({when:'',title:'',org:'',note:'',bullets:[]}); setDirty(); render(); }}),h('span',{class:'tag',text:'Section order:'}),ctl(c.sections,si)]));
    box.appendChild(sec); });
  box.appendChild(h('button',{class:'btn',text:'+ Add section',onclick:function(){ c.sections.push({title:'New section',items:[]}); setDirty(); render(); }}));
  return box; }
function tabContact(){ var c=content.contact, box=h('div',{});
  box.appendChild(h('h2',{text:'Contact and footer'}));
  box.appendChild(h('div',{class:'card'},[h('div',{class:'row'},[field('Small label',c,'eyebrow'),field('Headline',c,'title')]),h('div',{class:'row'},[field('Text',c,'lead',{area:true,rows:2})]),h('div',{class:'row'},[field('Email',c,'email'),field('LinkedIn address',c,'linkedin')]),h('div',{class:'row'},[field('Footer line',c,'footer')])]));
  return box; }
function newProject(){ return {id:'',title:'',tagline:'',year:String(new Date().getFullYear()),role:'',summary:'',cover:{src:'',alt:''},sections:[],_new:true,_touched:true}; }
function tabProjects(){ var box=h('div',{}), list=content.projects;
  box.appendChild(h('h2',{text:'Projects'})); box.appendChild(h('p',{class:'hint',text:'Projects added here appear in the project list and get their own share link and card. Your seven existing projects keep their own pages.'}));
  list.forEach(function(p,i){
    var card=h('div',{class:'card'});
    var idField=h('div',{},[h('label',{text:'Address (slug)'}),h('input',{type:'text',value:p.id,disabled:p._new?false:'disabled',oninput:function(e){ p.id=slugify(e.target.value); p._slugEdited=true; setDirty(); }})]);
    card.appendChild(h('div',{class:'row'},[field('Title',p,'title',{onInput:function(v){ p._touched=true; if(p._new&&!p._slugEdited){ p.id=slugify(v); var inp=idField.querySelector('input'); if(inp) inp.value=p.id; } }}),idField]));
    card.appendChild(h('div',{class:'row'},[field('One-line description',p,'tagline',{onInput:function(){p._touched=true;}}),field('Year',p,'year'),field('Your role',p,'role')]));
    card.appendChild(h('div',{class:'row'},[field('Summary (blank line = new paragraph)',p,'summary',{area:true,rows:5})]));
    card.appendChild(h('div',{class:'row'},[imagePicker('Cover image (shown whole)',function(){return p.cover.src;},function(v){ p.cover.src=v; p._touched=true; p._ogNew=true; })]));
    (p.sections||[]).forEach(function(sc,si){
      var sbox=h('div',{class:'card',style:'background:#fbf8f2'},[h('div',{class:'row'},[field('Section heading',sc,'heading')]),h('div',{class:'row'},[field('Text',sc,'text',{area:true,rows:4})])]);
      var imgs=h('div',{class:'imgs'}); (sc.images||[]).forEach(function(im,ii){ imgs.appendChild(h('div',{},[h('img',{class:'thumb',src:previewSrc(im.src)}),field('Caption',im,'caption'),h('button',{class:'btn ghost sm',text:'Remove',onclick:function(){ sc.images.splice(ii,1); setDirty(); render(); }})])); });
      var add=h('input',{type:'file',accept:'image/*',multiple:'multiple'}); add.addEventListener('change',async function(){ try{ for(var k=0;k<add.files.length;k++){ var path=await stageImage(add.files[k]); sc.images=sc.images||[]; sc.images.push({src:path,caption:''}); } setDirty(); render(); }catch(e){ toast(e.message,true); } });
      sbox.appendChild(imgs); sbox.appendChild(h('div',{class:'bar'},[h('label',{text:'Add images'}),add])); sbox.appendChild(ctl(p.sections,si));
      card.appendChild(sbox); });
    card.appendChild(h('div',{class:'bar'},[h('button',{class:'btn ghost sm',text:'+ Add section',onclick:function(){ p.sections=p.sections||[]; p.sections.push({heading:'New section',text:'',images:[]}); setDirty(); render(); }}),
      h('button',{class:'btn ghost sm',text:'Delete project',onclick:function(){ if(confirm('Delete "'+(p.title||'this project')+'"? Its link stops working after you publish.')){ if(!p._new) deleted.push(p); list.splice(i,1); setDirty(); render(); } }}),
      p._new?h('span',{class:'tag',text:'New, not published yet'}):h('a',{class:'tag',href:ORIGIN+p.id+'/',target:'_blank',text:'Open share link'}),h('span',{class:'tag',text:'Order:'}),ctl(list,i)]));
    box.appendChild(card); });
  box.appendChild(h('button',{class:'btn',text:'+ New project',onclick:function(){ list.push(newProject()); setDirty(); render(); }}));
  return box; }

/* ---------- publish ---------- */
function stubHtml(p){ var t=esc(p.title)+' · Bernardo Reyes', d=esc(p.tagline||p.title), u=ORIGIN+p.id+'/', img=ORIGIN+p.ogFile;
  return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+t+'</title>\n<meta name="description" content="'+d+'">\n<link rel="canonical" href="'+u+'">\n<meta property="og:type" content="website"><meta property="og:title" content="'+t+'"><meta property="og:description" content="'+d+'"><meta property="og:url" content="'+u+'"><meta property="og:image" content="'+img+'"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">\n<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="'+t+'"><meta name="twitter:description" content="'+d+'"><meta name="twitter:image" content="'+img+'">\n<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2EBDD;color:#141414;font-family:Georgia,serif;text-align:center}a{color:#D6271C;font-weight:700}</style>\n</head><body><p>Opening <b>'+esc(p.title)+'</b>…</p>\n<noscript><p><a href="../#p-'+p.id+'">Open the project</a></p></noscript>\n<script>location.replace("../#p-'+p.id+'");<\/script></body></html>\n'; }
function clean(o){ return JSON.parse(JSON.stringify(o,function(k,v){ return k.charAt(0)==='_'?undefined:v; })); }
function validate(){ var ids={}; for(var i=0;i<content.projects.length;i++){ var p=content.projects[i]; if(!p.title.trim()) return 'Every project needs a title.'; if(!p.id) return 'Project "'+p.title+'" needs an address.'; if(ids[p.id]) return 'Two projects share the address "'+p.id+'".'; ids[p.id]=1; if(['admin','img','og','savannah-philharmonic','movistar-game-club','heirline','bliss','bd-scad-pro','delta-scad-pro','deloitte-scad-pro'].indexOf(p.id)>=0&&p._new) return 'The address "'+p.id+'" is already used.'; if(!p.cover||!p.cover.src) return 'Project "'+p.title+'" needs a cover image for its share card.'; } return null; }
async function publish(){
  var err=validate(); if(err){ toast(err,true); return; }
  var btn=document.getElementById('pub'); btn.disabled=true; btn.textContent='Publishing…';
  try{
    var used={}; function collect(p){ if(p.cover&&p.cover.src) used[p.cover.src]=1; (p.sections||[]).forEach(function(s){ (s.images||[]).forEach(function(i){ used[i.src]=1; }); }); }
    content.projects.forEach(collect);
    var names=Object.keys(pending).filter(function(n){ return used[n]; });
    for(var i=0;i<names.length;i++){ btn.textContent='Uploading image '+(i+1)+' of '+names.length+'…'; var ex=await ghGet(names[i]); await ghPut(names[i],pending[names[i]].b64,'Admin: add image',ex&&ex.sha); }
    for(var j=0;j<content.projects.length;j++){ var p=content.projects[j]; if(!(p._new||p._touched||p._ogNew)) continue;
      btn.textContent='Share card for '+p.title+'…';
      if(p._ogNew||!p.ogFile){ var im=pending[p.cover.src]?pending[p.cover.src].im:await loadImage(await (await fetch(previewSrc(p.cover.src))).blob()); p.ogFile='og/'+p.id+'-'+Date.now().toString(36)+'.jpg'; await ghPut(p.ogFile,ogCard(im),'Admin: share image for '+p.title,null); }
      var path=p.id+'/index.html'; var ex2=await ghGet(path); await ghPut(path,b64(stubHtml(p)),'Admin: share page for '+p.title,ex2&&ex2.sha); }
    for(var k=0;k<deleted.length;k++){ var dp=deleted[k].id+'/index.html'; var ex3=await ghGet(dp); if(ex3) await ghDel(dp,'Admin: remove '+deleted[k].title,ex3.sha); }
    content.version=(content.version||1)+1; btn.textContent='Saving content…';
    var latest=await ghGet('content.json'); if(latest&&latest.sha!==sha){ if(!confirm('content.json changed on GitHub since you opened this page. Overwrite it with your version?')){ throw new Error('Cancelled. Reload the page to see the newer version.'); } }
    var res=await ghPut('content.json',b64(JSON.stringify(clean(content),null,2)+'\n'),'Admin: update portfolio content',latest&&latest.sha);
    sha=res.content.sha; deleted=[]; content.projects.forEach(function(p){ delete p._new; delete p._touched; delete p._ogNew; }); pending={};
    setDirty(false); toast('Published. The live site updates in about a minute.');
  }catch(e){ toast(e.message,true); setDirty(true); }
  btn.textContent='Publish'; btn.disabled=!dirty;
}

/* ---------- shell ---------- */
var TABS=[['menu','Menu',tabMenu],['about','About',tabAbout],['cv','CV',tabCV],['projects','Projects',tabProjects],['contact','Contact',tabContact]];
function render(){ app.innerHTML=''; var y=window.scrollY;
  if(!token){ return renderLogin(); }
